<div class="h-screen w-screen flex flex-col md:flex-row overflow-hidden bg-primary">
  <!-- Top Navigation Header (Mobile Only) -->
  <header class="flex md:hidden items-center justify-between p-4 border-b border-line bg-primary sticky top-0 z-30 shrink-0">
    <span class="font-medium text-lg">Ricky Boy De Gracia</span>
    <button (click)="toggleMenu()" class="p-2 text-gray-600 hover:text-black focus:outline-none" aria-label="Toggle Menu">
      @if (!isMenuOpen()) {
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      } @else {
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      }
    </button>
  </header>

  <!-- Sidebar (Pinned Desktop Sidebar / Mobile Overlay) -->
  <aside 
    class="fixed inset-x-0 top-[57px] bottom-0 bg-primary z-20 p-6 flex flex-col justify-between transition-all duration-200 ease-in-out md:static md:top-0 md:h-screen md:w-[250px] md:border-r md:border-line md:shrink-0 md:flex"
    [class.hidden]="!isMenuOpen()"
    [class.flex]="isMenuOpen()">
    
    <app-side-bar (itemClicked)="closeMenu()"></app-side-bar>
  </aside>

  <!-- Main Content Area (Independent Vertical Scroll) -->
  <main class="flex-1 h-full overflow-y-auto p-4 md:p-8" [class.hidden]="isMenuOpen()" [class.block]="!isMenuOpen()">
    <router-outlet></router-outlet>
  </main>
</div>
