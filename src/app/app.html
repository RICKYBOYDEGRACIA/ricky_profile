<div class="min-h-screen flex flex-col md:flex-row">
  <!-- Top Navigation Header (Mobile Only) -->
  <header class="flex md:hidden items-center justify-between p-4 border-b border-line sticky top-0 z-20">
    <span class="font-medium text-lg">Ricky Boy De Gracia</span>
    <button (click)="toggleMenu()" class="p-2 text-gray-600 hover:text-black focus:outline-none" aria-label="Toggle Menu">
      @if (!isMenuOpen()) {
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      } @else {
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      }
    </button>
  </header>

  <!-- Sidebar (Overlay on Mobile, Column on Desktop) -->
  <aside 
    class="fixed inset-x-0 top-[57px] bottom-0 z-10 p-6 flex flex-col justify-between transition-all duration-200 ease-in-out md:static md:top-auto md:w-[250px] md:min-h-screen md:border-r md:border-line md:flex"
    [class.hidden]="!isMenuOpen()"
    [class.flex]="isMenuOpen()">
    
    <app-side-bar (itemClicked)="closeMenu()"></app-side-bar>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-4 md:p-6" [class.hidden]="isMenuOpen()" [class.block]="!isMenuOpen()">
    <router-outlet></router-outlet>
  </main>
</div>
