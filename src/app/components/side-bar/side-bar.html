<div class="flex flex-col h-full justify-between">
  
  <!-- Top Section (flex-1 forces it to take up all remaining height) -->
  <div class="flex-1 space-y-2">
    <!-- Desktop Title -->
    <div 
      (click)="home()" 
      class="hidden md:flex items-center cursor-pointer mb-8 hover:bg-active hover:text-active-text p-2 rounded-md font-medium transition-colors">
      <span>Ricky Boy De Gracia</span>
    </div>

    @for (item of sideBarItems; track $index) {
      <a 
        [routerLink]="item.route" 
        routerLinkActive="font-semibold bg-active text-active-text" 
        [routerLinkActiveOptions]="{ exact: item.route === '/' }"
        (click)="itemClicked.emit()"
        class="flex items-center gap-3 cursor-pointer hover:bg-active p-2.5 rounded-md text-color-primary hover:text-active-text transition-colors">
        <img [src]="item.icon" class="w-5 h-5" [alt]="item.name"/>
        <span class="text-base">{{ item.name }}</span>
      </a>
    }
  </div>

  <!-- Bottom Theme Toggle (Pushed down naturally by flex layout) -->
  <div class="pt-6 mt-auto">
    <div class="border border-line p-2 rounded-full flex gap-4 items-center justify-center w-fit transition-colors">
      
      <!-- Dark Mode Icon -->
      <img 
        src="dark-mode.png" 
        (click)="switchTheme('dark', $event)" 
        class="w-4 h-4 cursor-pointer transition-opacity hover:opacity-100" 
        [class.opacity-100]="themeService.currentTheme() === 'dark'"
        [class.opacity-50]="themeService.currentTheme() === 'light'"
        alt="Dark mode">

      <!-- Light Mode Icon -->
      <img 
        src="light-mode.png" 
        (click)="switchTheme('light', $event)" 
        class="w-4 h-4 cursor-pointer transition-opacity hover:opacity-100" 
        [class.opacity-100]="themeService.currentTheme() === 'light'"
        [class.opacity-50]="themeService.currentTheme() === 'dark'"
        alt="Light mode">

    </div>
  </div>

</div>
