<div class="p-4 rounded-lg w-full min-h-screen flex flex-col items-center">
  <div class="w-full md:w-[90%] lg:w-[65%] xl:w-[50%] flex flex-col gap-6">
    
    <!-- Page Header -->
    <div class="mb-4 border-b border-line pb-4">
      <h1 class="text-2xl font-bold text-main">Blogs</h1>
      <p class="text-sm text-secondary mt-1">
        Thoughts, technical write-ups, and notes on frontend development.
      </p>
    </div>

    <!-- Blog Posts List -->
    <div class="flex flex-col gap-6">
      @for (post of blogs; track post.id) {
        <article class="group border border-line rounded-xl p-5 bg-primary hover:border-secondary transition-all duration-200 flex flex-col gap-3 cursor-pointer">
          
          <!-- Post Meta Info -->
          <div class="flex items-center justify-between text-xs text-secondary">
            <span>{{ post.publishedDate }}</span>
            <span>{{ post.readTime }}</span>
          </div>

          <!-- Post Title -->
          <h2 class="text-lg font-semibold text-main group-hover:text-secondary transition-colors duration-200">
            {{ post.title }}
          </h2>

          <!-- Post Excerpt -->
          <p class="text-sm text-secondary leading-relaxed text-justify">
            {{ post.excerpt }}
          </p>

          <!-- Post Tags -->
          <div class="flex flex-wrap gap-2 pt-2">
            @for (tag of post.tags; track $index) {
              <span class="text-xs px-2.5 py-0.5 rounded-full bg-active border border-line text-secondary">
                #{{ tag }}
              </span>
            }
          </div>

        </article>
      }
    </div>

  </div>
</div>
