<div class="p-4 rounded-lg w-full min-h-screen flex flex-col items-center">
  <div class="w-full md:w-[90%] lg:w-[65%] xl:w-[50%] flex flex-col gap-6">
    <!-- Page Header -->
    <div class="mb-4 border-b border-line pb-4">
      <h1 class="text-xl font-semibold">Tech Stack</h1>
      <p class="text-sm text-secondary mt-1">
        Complete set of software, tools, frameworks, and programming languages used to build and run
        a software application.
      </p>
    </div>

    <div class="flex flex-col gap-6">
      @for (item of techStack; track $index) {
        <div
          class="border border-line rounded-xl p-5 bg-primary hover:border-secondary transition-all duration-200 flex gap-8 items-center cursor-pointer"
        >
          <div class="flex flex-col items-center justify-center shrink-0 w-24 text-center">
            <img [src]="item.path" [alt]="item.alt" class="w-12 h-12 object-contain mb-2" />
            <p class="text-xs whitespace-nowrap">{{ item.years }}</p>
          </div>
          <div class="flex">
            <p class="text-justify">{{ item.details }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</div>
